name: Solana Vault CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "18"

jobs:
  lint-and-check:
    name: Lint & Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Check TypeScript compilation
        run: npx tsc --noEmit --skipLibCheck || true

      - name: Verify project structure
        run: |
          echo "=== Checking critical files ==="
          test -f Anchor.toml && echo "✅ Anchor.toml" || echo "❌ Anchor.toml missing"
          test -f Cargo.toml && echo "✅ Cargo.toml" || echo "❌ Cargo.toml missing"
          test -f programs/vault/src/lib.rs && echo "✅ Program entry point" || echo "❌ lib.rs missing"
          test -f tests/vault.ts && echo "✅ Integration tests" || echo "❌ Tests missing"
          test -f postman/solana-vault-api-tests.postman_collection.json && echo "✅ Postman collection" || echo "❌ Postman collection missing"
          echo "=== Project structure verified ==="

  api-tests:
    name: Postman API Tests (Devnet)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Postman collection against Devnet
        run: |
          newman run postman/solana-vault-api-tests.postman_collection.json \
            --environment postman/solana-vault-devnet.postman_environment.json \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export reports/api-test-report.html \
            --delay-request 500

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-report
          path: reports/api-test-report.html
