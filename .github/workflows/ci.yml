name: Solana Vault CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "18"

jobs:
  lint-and-check:
    name: Lint & Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Verify project structure
        run: |
          echo "=== Checking critical files ==="
          test -f Anchor.toml && echo "✅ Anchor.toml" || exit 1
          test -f Cargo.toml && echo "✅ Cargo.toml" || exit 1
          test -f programs/vault/src/lib.rs && echo "✅ Program entry point" || exit 1
          test -f tests/vault.ts && echo "✅ Integration tests" || exit 1
          test -f postman/solana-vault-api-tests.postman_collection.json && echo "✅ Postman collection" || exit 1
          test -d sdk && echo "✅ TypeScript SDK" || exit 1
          echo "=== All critical files present ==="

      - name: Verify Anchor config
        run: |
          echo "=== Anchor Configuration ==="
          grep -q "vault" Anchor.toml && echo "✅ Vault program configured"
          grep -q "anchor_version" Anchor.toml && echo "✅ Anchor version specified"
          echo "=== Config verified ==="

  api-tests:
    name: Postman API Tests (Devnet)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman collection against Devnet
        run: |
          newman run postman/solana-vault-api-tests.postman_collection.json \
            --env-var "rpc_url=https://api.devnet.solana.com" \
            --env-var "vault_program_id=Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS" \
            --env-var "wallet_address=11111111111111111111111111111111" \
            --delay-request 1000
