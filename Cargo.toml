[workspace]
members = [
    "programs/vault"
]

resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# Patches to avoid edition2024 crates that Solana's Rust 1.75.0 cannot parse
[patch.crates-io]
# blake3 1.5.1 uses constant_time_eq 0.3.x (not 0.4.2 which requires edition2024)
blake3 = { git = "https://github.com/BLAKE3-team/BLAKE3", tag = "1.5.1" }
# jobserver 0.1.32 avoids getrandom 0.3.x -> wasip2 -> wit-bindgen (edition2024)
jobserver = { git = "https://github.com/rust-lang/jobserver-rs", tag = "0.1.32" }
# Lock toml_edit to version compatible with Rust 1.79 (v0.21.1 commit)
toml_edit = { git = "https://github.com/toml-rs/toml", rev = "v0.21.1" }
